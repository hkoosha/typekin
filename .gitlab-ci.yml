sync-to-github:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache git openssh-client
    - eval $(ssh-agent -s)
    - echo "$MY_GITHUB_SYNC" | sed 's/_/ /g' | tr '@' '\n' | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
  script:
    - git remote add github git@github.com:hkoosha/narges.git || true
    - git fetch --unshallow
    - git push github HEAD:master --force
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
