[package]
name = "typekin"
authors = ["Koosha H <git@koosha.io>"]
license = "GPL-3"

version.workspace = true
edition.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[[bin]]
name = "typekin-unexpand"
path = "src/main.rs"

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true, features = ["extra-traits"] }
quote = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
typekin_testing = { path = "../typekin_testing" }

[[example]]
name = "my_u32"
path = "examples/my_u32.rs"

[[example]]
name = "my_u32_expanded"
path = "examples/my_u32_expanded.rs"

[[example]]
name = "my_u32_non_const"
path = "examples/my_u32_non_const.rs"

[[example]]
name = "my_u32_non_const_expanded"
path = "examples/my_u32_non_const_expanded.rs"
