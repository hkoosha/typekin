[package]
name = "typekin_testing"
authors = ["Koosha H <git@koosha.io>"]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
homepage = "https://koosha.io/project/typekin"
repository = "https://gitlab.com/hkoosha/typekin"
description = "Unpublished crate only for testing the crate: typekin"

publish = false

[features]
default = ["test_fast"]
test_slow = ["test_fast", "test_slow_only"]
test_fast = []
test_slow_only = []

[lints.clippy]
needless_return = "allow"

[lints.cargo]
unused_dependencies = "allow"

[dependencies]
typekin = { path = ".." }
serde = { version = "1", default-features = false, features = ["alloc"] }
serde_test = "1"

[[bin]]
name = "my_u32"
path = "src/fixture_my_u32.rs"
test = false
bench = false

[[bin]]
name = "my_u32_const"
path = "src/fixture_my_u32_const.rs"
test = false
bench = false

[[bin]]
name = "my_sequence"
path = "src/fixture_my_sequence.rs"
test = false
bench = false
